# ==============================================================================
# TwoNr9 Hardware & Power Configuration -- "smol2nr9"
#
# Same keyboard, same settings as config/twonr9.conf; only the pin wiring in
# boards/shields/smol2nr9/ differs. ZMK has no include mechanism for .conf
# files, so keep the two in sync when editing.
# ==============================================================================

# Enable deep sleep support after inactivity to maximize battery life
CONFIG_ZMK_SLEEP=y

# Battery Level Reporting (updates every 60 seconds)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Split Central Battery Monitoring (Left central fetches and reports right half battery)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Bluetooth Transmission Power (+8 dBm for maximum signal stability across obstacles)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce Timings (in milliseconds: 1ms press for responsiveness, 5ms release for stability)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Adaptive Key Trigger Capacity (Expanded for letters, symbols, and swap rules)
CONFIG_ZMK_ADAPTIVE_KEY_MAX_TRIGGER_CONDITIONS=64

# Mouse layer: pointer movement, buttons and scrolling (twonr9_mouse.dtsi)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=20

# zmk-vim-mode rides three unused HID LED indicator bits; the module selects this too
CONFIG_ZMK_HID_INDICATORS=y
