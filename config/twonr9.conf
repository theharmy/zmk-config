# ==============================================================================
# TwoNr9 Hardware & Power Configuration
# ==============================================================================

# Enable deep sleep support after inactivity to maximize battery life
CONFIG_ZMK_SLEEP=y

# Battery Level Reporting (updates every 60 seconds)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Split Central Battery Monitoring (Left central fetches and reports right half battery)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Bluetooth Transmission Power (+8 dBm for maximum signal stability across obstacles)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce Timings (in milliseconds: 1ms press for responsiveness, 5ms release for stability)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
