# Debounce Timings (in milliseconds: 1ms press for responsiveness, 5ms release for stability)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Adaptive Key Trigger Capacity (Expanded for letters, symbols, and swap rules)
CONFIG_ZMK_ADAPTIVE_KEY_MAX_TRIGGER_CONDITIONS=64
