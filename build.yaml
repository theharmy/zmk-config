# ==============================================================================
# TwoNr9 Build Matrix -- DEFAULT ("bugwind")
#
# Defines firmware targets compiled locally via `just build` and in GitHub Actions.
# Target format uses ZMK v2 Hardware Model syntax (<board>@<revision>//zmk).
#
# This is the main variant: config/twonr9.keymap, built by the twonr9_* shields.
# ZMK picks the keymap up by shield name, so no cmake-args are needed.
#
# The optional "srht" variant lives in build-srht.yaml (`just build-srht`).
# ==============================================================================
---
include:
  # 1. Central Half (Left) - Standard build
  - board: nice_nano@2.0.0//zmk
    shield: twonr9_left

  # 2. Central Half (Left) with ZMK Studio & KeyPeek Raw HID
  # Includes:
  #   - raw_hid_adapter shield: streams layer events to KeyPeek desktop overlay
  #   - studio-rpc-usb-uart snippet: enables ZMK Studio GUI live remapping over USB
  #   - -DCONFIG_ZMK_STUDIO=y: activates Studio subsystem
  - board: nice_nano@2.0.0//zmk
    shield: twonr9_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: twonr9_left_with_studio

  # 3. Peripheral Half (Right) - Wireless BLE peripheral
  - board: nice_nano@2.0.0//zmk
    shield: twonr9_right

  # 4. Settings Reset Shield - Diagnostic utility to clear corrupted Bluetooth bonds
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
