<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1040" viewBox="0 0 848 1040">
<style>svg { font-family:Calibri,system-ui,sans-serif; }
.title { fill:#fbf1c7; font-size:22px; font-weight:700; }
