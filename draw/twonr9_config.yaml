parse_config:
  zmk_additional_includes:
    - "modules/zmk/helpers/include"
    - "config"

  zmk_preamble: |
    #include "keys_de.h"
    #define ALL 0 1 2 3 4 5

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": "⇪"
    "&studio_unlock": "🔓"

  trans_legend: { "t": "", "type": "trans" }

  zmk_keycode_map:
    LALT: "⌥"
    RALT: "⌥"
    LCTRL: "⌃"
    RCTRL: "⌃"
    LGUI: "⌘"
    RGUI: "⌘"
    LSHFT: "⇧"
    RSHFT: "⇧"
    LEFT_SHIFT: "⇧"
    LEFT_CONTROL: "⌃"
    LEFT_ALT: "⌥"
    LEFT_GUI: "⌘"

    BSPC: "⌫"
    DEL: "⌦"
    ESC: "⎋"
    RET: "⏎"
    RETURN: "⏎"
    SPACE: Spc
    TAB: "⇥"

    PG_UP: "⇞"
    PG_DN: "⇟"
    INS: Ins
    HOME: "↖"
    END: "↘"

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    UP_ARROW: ↑
    DOWN_ARROW: ↓

draw_config:
  n_columns: 1
  append_colon_to_layer_header: false
  dark_mode: false
  footer_text: "urob/zmk-config"
  shrink_wide_legends: 0
  glyph_tap_size: 22
  glyph_hold_size: 13
  glyph_shifted_size: 13
  legend_rel_y: 1
  outer_pad_w: 8
  outer_pad_h: 8
  inner_pad_w: 9
  inner_pad_h: 11
  small_pad: 2
  key_w: 98
  key_h: 92
  combo_w: 34
  combo_h: 22

  svg_style: |
    svg path { fill: inherit; }

    svg.keymap {
        --color-bg:      #7c6f64;
        --color-key:     #fbf1c7;
        --color-text:    #282828;
        --color-ghost:   #928374;
        --color-dendron: #d5c4a1;
        --color-held:    #bdae93;

        --color-sym:     #458588;
        --color-nav:     #d79921;
        --color-num:     #d65d0e;
        --color-fn:      #689d6a;

        fill: var(--color-text);
        background-color: var(--color-bg);
        font-family: Calibri, system-ui, sans-serif;
        font-size: 20px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.02em;
    }

    text.tap     { font-weight: 700; font-size: 22px; fill: #282828; }
    text.hold    { font-weight: 600; font-size: 13px; fill: #b57614; }
    text.shifted { font-weight: 500; font-size: 13px; }
    text.combo, text.left, text.right { font-size: 13px; font-weight: 600; }
    text.tl                   { font-size: 13px; font-weight: 700; }
    text.tr, text.bl          { font-size: 15px; font-weight: 700; }
    text.br                   { font-size: 11px; font-weight: 700; }

    text.hold, text.bl, text.br    { text-anchor: middle; dominant-baseline: auto; }
    text.shifted, text.tl, text.tr { text-anchor: middle; dominant-baseline: hanging; }
    text.left, text.tl, text.bl    { text-anchor: start; }
    text.right, text.tr, text.br   { text-anchor: end; }

    text.layer-activator { font-weight: 700; }
    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right { font-size: 9px; }

    text.label, text.footer {
        fill: var(--color-key);
        stroke: var(--color-bg);
        stroke-width: 4;
        paint-order: stroke;
    }
    text.label  { font-weight: bold; font-size: 24px; text-anchor: start; }
    text.footer { text-anchor: end; dominant-baseline: auto; font-size: 15px; }

    /* Default key and combo styles */
    rect.key, rect.combo-separate { fill: var(--color-key); stroke-width: 0; }
    rect.combo                    { fill: var(--color-key); stroke-width: 0; fill-opacity: 0.72; opacity: 0.90; }
    rect.held, rect.combo.held    { fill: var(--color-held); }

    /* Layer-specific key tints */
    .layer-a1 rect.key          { fill: #fbf1c7; }
    .layer-a2 rect.key          { fill: #ebdbb2; }
    .layer-nav rect.key         { fill: #fdf0cd; }
    .layer-sym rect.key         { fill: #d8eae5; }
    .layer-fn rect.key          { fill: #dbe8d8; }
    .layer-num rect.key         { fill: #fae0d0; }
    .layer-Bigrams rect.key     { fill: var(--color-ghost); }
    .layer-Symbols rect.key     { fill: var(--color-ghost); }
    .layer-Combos rect.key      { fill: var(--color-ghost); }
    [class*="layer-Symbols"] rect.key { fill: var(--color-ghost); }
    [class*="layer-Combos"] rect.key  { fill: var(--color-ghost); }

    /* Combo box colors: Neutral, key-like translucent fill for universal combos */
    rect.combo,
    .combo.bigram rect.combo, g.combo.bigram rect,
    .combo.symbol rect.combo, g.combo.symbol rect,
    .combo.util rect.combo, g.combo.util rect,
    .combo.system rect.combo, g.combo.system rect,
    .combo.multi rect.combo, g.combo.multi rect,
    .combo.sym rect.combo, g.combo.sym rect,
    .combo.nav rect.combo, g.combo.nav rect,
    .combo.fn rect.combo, g.combo.fn rect,
    .combo.a2 rect.combo, g.combo.a2 rect {
        fill: #ebdbb2 !important;
        fill-opacity: 0.55;
        stroke: #d5c4a1;
        stroke-width: 1px;
    }
    text.combo,
    .combo.bigram text.combo, g.combo.bigram text,
    .combo.symbol text.combo, g.combo.symbol text,
    .combo.util text.combo, g.combo.util text,
    .combo.system text.combo, g.combo.system text,
    .combo.multi text.combo, g.combo.multi text,
    .combo.sym text.combo, g.combo.sym text,
    .combo.nav text.combo, g.combo.nav text,
    .combo.fn text.combo, g.combo.fn text,
    .combo.a2 text.combo, g.combo.a2 text {
        fill: #282828 !important;
        font-weight: 700;
    }

    /* Colorful Bigrams on Layer Views */
    .layer-a1 .combo.bigram rect.combo, .layer-a1 g.combo.bigram rect,
    [class*="layer-a1"] .combo.bigram rect.combo, [class*="layer-a1"] g.combo.bigram rect {
        fill: #fabd2f !important;
        fill-opacity: 0.85;
        stroke: #d79921;
        stroke-width: 1.5px;
    }
    .layer-a1 .combo.bigram text.combo, .layer-a1 g.combo.bigram text,
    [class*="layer-a1"] .combo.bigram text.combo, [class*="layer-a1"] g.combo.bigram text {
        fill: #3c3836 !important;
        font-weight: 700;
    }

    .layer-a2 .combo.bigram rect.combo, .layer-a2 g.combo.bigram rect,
    [class*="layer-a2"] .combo.bigram rect.combo, [class*="layer-a2"] g.combo.bigram rect {
        fill: #b16286 !important;
        fill-opacity: 0.85;
        stroke: #8f3f71;
        stroke-width: 1.5px;
    }
    .layer-a2 .combo.bigram text.combo, .layer-a2 g.combo.bigram text,
    [class*="layer-a2"] .combo.bigram text.combo, [class*="layer-a2"] g.combo.bigram text {
        fill: #fbf1c7 !important;
        font-weight: 700;
    }

    /* ONLY Number Combo Boxes are Orange */
    .combo.num rect.combo, g.combo.num rect {
        fill: #d65d0e !important;
        fill-opacity: 0.90;
        stroke: #af3a03;
        stroke-width: 1.5px;
    }
    .combo.num text.combo, g.combo.num text {
        fill: #fbf1c7 !important;
        font-weight: 700;
    }

    /* Clearly Visible Combo Connection Lines */
    path.combo { stroke: #504945; stroke-width: 2.2; stroke-dasharray: 4, 3; opacity: 0.85; fill: none; }

    /* Dual-alpha and combo split color classes */
    tspan.a1-tap, tspan.a1-bigram { fill: #282828; font-weight: 700; }
    tspan.slash-tap               { fill: #7c6f64; font-weight: 400; opacity: 0.6; }
    tspan.a2-tap, tspan.a2-bigram { fill: #b16286; font-weight: 700; }

    /* Four-Corner Legend Colors */
    text.tl, use.tl, .tl { fill: #458588 !important; }
    text.tr, use.tr, .tr { fill: #d79921 !important; }
    text.bl, use.bl, .bl { fill: #d65d0e !important; }
    text.br, use.br, .br { fill: #689d6a !important; }

    /* Layer Activation Colors at the Bottom of Keys */
    .hold-sym { fill: #458588 !important; font-weight: 700; }
    .hold-nav { fill: #d79921 !important; font-weight: 700; }
    .hold-num { fill: #d65d0e !important; font-weight: 700; }
    .hold-fn  { fill: #689d6a !important; font-weight: 700; }
    .hold-mod { fill: #b57614 !important; font-weight: 600; }

    .icon-tabler > path                             { fill: inherit; stroke: inherit; stroke-width: 2; }
    .icon-tabler > path[stroke="none"][fill="none"] { visibility: hidden; }

    @media (prefers-color-scheme: dark) {
        svg.keymap {
            --color-bg:      #282828;
            --color-key:     #3c3836;
            --color-text:    #ebdbb2;
            --color-ghost:   #504945;
            --color-dendron: #7c6f64;
            --color-held:    #665c54;

            --color-sym:     #83a598;
            --color-nav:     #fabd2f;
            --color-num:     #fe8019;
            --color-fn:      #b8bb26;
        }
        text.tap                      { fill: #ebdbb2; }
        tspan.a1-tap, tspan.a1-bigram { fill: #ebdbb2; font-weight: 700; }
        tspan.slash-tap               { fill: #928374; font-weight: 400; opacity: 0.6; }
        tspan.a2-tap, tspan.a2-bigram { fill: #d3869b; font-weight: 700; }
        .layer-a1 rect.key          { fill: #3c3836; }
        .layer-a2 rect.key          { fill: #48413c; }
        .layer-nav rect.key         { fill: #4a3e2b; }
        .layer-sym rect.key         { fill: #2d3e3a; }
        .layer-fn rect.key          { fill: #2f402c; }
        .layer-num rect.key         { fill: #4a3528; }
        .layer-Bigrams rect.key     { fill: #504945; }
        .layer-Symbols rect.key     { fill: #504945; }
        .layer-Combos rect.key      { fill: #504945; }
        text.tl, use.tl, .tl        { fill: #83a598 !important; }
        text.tr, use.tr, .tr        { fill: #fabd2f !important; }
        text.bl, use.bl, .bl        { fill: #fe8019 !important; }
        text.br, use.br, .br        { fill: #b8bb26 !important; }
        .hold-sym                   { fill: #83a598 !important; font-weight: 700; }
        .hold-nav                   { fill: #fabd2f !important; font-weight: 700; }
        .hold-num                   { fill: #fe8019 !important; font-weight: 700; }
        .hold-fn                    { fill: #b8bb26 !important; font-weight: 700; }
        .hold-mod                   { fill: #fabd2f !important; font-weight: 600; }

        rect.combo,
        .combo.bigram rect.combo, g.combo.bigram rect,
        .combo.symbol rect.combo, g.combo.symbol rect,
        .combo.util rect.combo, g.combo.util rect,
        .combo.system rect.combo, g.combo.system rect,
        .combo.multi rect.combo, g.combo.multi rect,
        .combo.sym rect.combo, g.combo.sym rect,
        .combo.nav rect.combo, g.combo.nav rect,
        .combo.fn rect.combo, g.combo.fn rect,
        .combo.a2 rect.combo, g.combo.a2 rect {
            fill: #504945 !important;
            fill-opacity: 0.55;
            stroke: #665c54;
        }
        text.combo,
        .combo.bigram text.combo, g.combo.bigram text,
        .combo.symbol text.combo, g.combo.symbol text,
        .combo.util text.combo, g.combo.util text,
        .combo.system text.combo, g.combo.system text,
        .combo.multi text.combo, g.combo.multi text,
        .combo.sym text.combo, g.combo.sym text,
        .combo.nav text.combo, g.combo.nav text,
        .combo.fn text.combo, g.combo.fn text,
        .combo.a2 text.combo, g.combo.a2 text {
            fill: #ebdbb2 !important;
            font-weight: 700;
        }

        .layer-a1 .combo.bigram rect.combo, .layer-a1 g.combo.bigram rect,
        [class*="layer-a1"] .combo.bigram rect.combo, [class*="layer-a1"] g.combo.bigram rect {
            fill: #fabd2f !important;
            fill-opacity: 0.90;
            stroke: #d79921;
        }
        .layer-a1 .combo.bigram text.combo, .layer-a1 g.combo.bigram text,
        [class*="layer-a1"] .combo.bigram text.combo, [class*="layer-a1"] g.combo.bigram text {
            fill: #282828 !important;
        }

        .layer-a2 .combo.bigram rect.combo, .layer-a2 g.combo.bigram rect,
        [class*="layer-a2"] .combo.bigram rect.combo, [class*="layer-a2"] g.combo.bigram rect {
            fill: #d3869b !important;
            fill-opacity: 0.90;
            stroke: #b16286;
        }
        .layer-a2 .combo.bigram text.combo, .layer-a2 g.combo.bigram text,
        [class*="layer-a2"] .combo.bigram text.combo, [class*="layer-a2"] g.combo.bigram text {
            fill: #282828 !important;
        }

        .combo.num rect.combo, g.combo.num rect {
            fill: #fe8019 !important;
            fill-opacity: 0.90;
            stroke: #d65d0e;
        }
        .combo.num text.combo, g.combo.num text {
            fill: #282828 !important;
        }
        path.combo                  { stroke: #d5c4a1; stroke-width: 2.2; stroke-dasharray: 4, 3; opacity: 0.85; }
    }
