parse_config:
  zmk_additional_includes:
    - "modules/zmk/helpers/include"
    - "config"

  zmk_preamble: |
    #include "keys_de.h"
    #define ALL 0 1 2 3 4 5

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": Caps Word
    "&studio_unlock": Unlock

  trans_legend: { "t": "", "type": "trans" }

  zmk_keycode_map:
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    LEFT_SHIFT: Shift
    LEFT_CONTROL: Ctrl
    LEFT_ALT: Alt
    LEFT_GUI: Gui

    BSPC: Bspc
    DEL: Del
    ESC: Esc
    RET: Enter
    RETURN: Enter
    SPACE: Spc
    TAB: Tab

    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    UP_ARROW: ↑
    DOWN_ARROW: ↓

draw_config:
  n_columns: 2
  append_colon_to_layer_header: false
  dark_mode: false
  footer_text: "urob/zmk-config"
  glyph_tap_size: 16
  glyph_hold_size: 13
  glyph_shifted_size: 11
  legend_rel_y: 1
  outer_pad_w: 16
  outer_pad_h: 16
  inner_pad_w: 14
  inner_pad_h: 14
  small_pad: 5
  key_w: 68
  key_h: 64
  combo_w: 30
  combo_h: 24

  svg_style: |
    svg path { fill: inherit; }

    svg.keymap {
        --color-bg:      #7c6f64;
        --color-key:     #fbf1c7;
        --color-text:    #3c3836;
        --color-ghost:   #928374;
        --color-dendron: #d5c4a1;
        --color-held:    #bdae93;

        --color-fn:      #458588;
        --color-nav:     #d79921;
        --color-num:     #d65d0e;
        --color-sys:     #689d6a;

        fill: var(--color-text);
        background-color: var(--color-bg);
        font-family: Calibri, system-ui, sans-serif;
        font-size: 16px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.02em;
    }

    text.tap     { font-weight: 600; font-size: 16px; }
    text.hold    { font-weight: 500; font-size: 12px; fill: #b57614; }
    text.shifted { font-weight: 400; font-size: 11px; }
    text.combo, text.left, text.right { font-size: 10px; font-weight: 600; }
    text.tl, text.tr, text.bl, text.br { font-size: 11px; font-weight: 700; }

    text.hold, text.bl, text.br    { text-anchor: middle; dominant-baseline: auto; }
    text.shifted, text.tl, text.tr { text-anchor: middle; dominant-baseline: hanging; }
    text.left, text.tl, text.bl    { text-anchor: start; }
    text.right, text.tr, text.br   { text-anchor: end; }

    text.layer-activator { text-decoration: underline; font-weight: 600; }
    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right { font-size: 8px; }

    text.label, text.footer {
        fill: var(--color-key);
        stroke: var(--color-bg);
        stroke-width: 4;
        paint-order: stroke;
    }
    text.label  { font-weight: bold; font-size: 18px; text-anchor: start; }
    text.footer { text-anchor: end; dominant-baseline: auto; font-size: 12px; }

    /* Default key and combo styles */
    rect.key, rect.combo, rect.combo-separate { fill: var(--color-key); stroke-width: 0; }
    rect.held, rect.combo.held                { fill: var(--color-held); }

    /* Layer-specific key tints */
    .layer-a1 rect.key          { fill: #fbf1c7; }
    .layer-a2 rect.key          { fill: #ebdbb2; }
    .layer-nav rect.key         { fill: #fdf0cd; }
    .layer-sym rect.key         { fill: #d8eae5; }
    .layer-sym2 rect.key        { fill: #dbe8d8; }
    .layer-num rect.key         { fill: #fae0d0; }
    .layer-Bigrams rect.key     { fill: var(--color-ghost); }
    .layer-Symbols rect.key     { fill: var(--color-ghost); }
    .layer-Combos rect.key      { fill: var(--color-ghost); }
    [class*="layer-Symbols"] rect.key { fill: var(--color-ghost); }
    [class*="layer-Combos"] rect.key  { fill: var(--color-ghost); }

    /* Combo box colors by category */
    .combo-bigram rect.combo   { fill: #fabd2f; }
    .combo-bigram text.combo   { fill: #3c3836; }
    .combo-symbol rect.combo   { fill: #83a598; }
    .combo-symbol text.combo   { fill: #fbf1c7; }
    .combo-util rect.combo     { fill: #fe8019; }
    .combo-util text.combo     { fill: #fbf1c7; }
    .combo-system rect.combo   { fill: #d3869b; }
    .combo-system text.combo   { fill: #3c3836; }

    path.combo { stroke: var(--color-dendron); stroke-width: 2; stroke-dasharray: 2, 3; opacity: 0.55; fill: none; }

    text.tl, use.tl { fill: var(--color-fn); }
    text.tr, use.tr { fill: var(--color-nav); }
    text.bl, use.bl { fill: var(--color-num); }
    text.br, use.br { fill: var(--color-sys); }

    .icon-tabler > path                             { fill: inherit; stroke: inherit; stroke-width: 2; }
    .icon-tabler > path[stroke="none"][fill="none"] { visibility: hidden; }

    @media (prefers-color-scheme: dark) {
        svg.keymap {
            --color-bg:      #282828;
            --color-key:     #3c3836;
            --color-text:    #ebdbb2;
            --color-ghost:   #504945;
            --color-dendron: #7c6f64;
            --color-held:    #665c54;

            --color-fn:      #83a598;
            --color-nav:     #fabd2f;
            --color-num:     #fe8019;
            --color-sys:     #b8bb26;
        }
        .layer-a1 rect.key          { fill: #3c3836; }
        .layer-a2 rect.key          { fill: #48413c; }
        .layer-nav rect.key         { fill: #4a3e2b; }
        .layer-sym rect.key         { fill: #2d3e3a; }
        .layer-sym2 rect.key        { fill: #2f402c; }
        .layer-num rect.key         { fill: #4a3528; }
        .layer-Bigrams rect.key     { fill: #504945; }
        .layer-Symbols rect.key     { fill: #504945; }
        .layer-Combos rect.key      { fill: #504945; }
    }
