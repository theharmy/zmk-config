name: Test Local Build Environment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-build-env.yml
      - draw/**
      - tests/**
      - Justfile
      - nix/**
      - flake.*
      - config/*.keymap
      - config/*.dtsi
      - config/*.h
      - config/boards/**
  pull_request:
    paths:
      - .github/workflows/test-build-env.yml
      - draw/**
      - tests/**
      - Justfile
      - nix/**
      - flake.*
      - config/*.keymap
      - config/*.dtsi
      - config/*.h
      - config/boards/**

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     system: x86_64-linux }
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
          - { os: macos-15-intel,   system: x86_64-darwin }
          - { os: macos-15,         system: aarch64-darwin }

    name: ${{ matrix.system }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test draw recipe
        if: runner.os == 'Linux'
        run: nix develop --command just draw-twonr9
      - name: Check drawings are reproducible
        if: runner.os == 'Linux'
        run: nix develop --command just draw-check all
      - name: Test drawing metadata
        run: nix develop --command python3 -m unittest discover -s tests
      - name: Set up build environment
        if: runner.os == 'Linux'
        run: nix develop --command just init
      - name: Test build recipe
        if: runner.os == 'Linux'
        run: nix develop --command just build twonr9_left
