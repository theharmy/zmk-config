# ==============================================================================
# Helix Editor Language Configuration for ZMK Workspace
# ==============================================================================

# 1. Devicetree & Keymaps via dedicated dts-lsp-server
[[language]]
name = "devicetree"
scope = "source.dts"
file-types = ["keymap", "dtsi", "dts", "overlay"]
language-servers = ["dts-lsp"]
indent = { tab-width = 4, unit = "    " }

[language.formatter]
command = "dts-format"
args = ["--fix"]

[language-server.dts-lsp]
command = "dts-lsp-server"
args = ["--stdio"]

# 2. C / Headers via clangd
[[language]]
name = "c"
scope = "source.c"
file-types = ["c", "h"]
language-servers = ["clangd"]
indent = { tab-width = 4, unit = "    " }

[language-server.clangd]
command = "clangd"
args = [
  "--compile-commands-dir=.",
  "--background-index",
  "--clang-tidy",
  "--header-insertion=never",
  "--all-scopes-completion"
]
